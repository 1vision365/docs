# Copy this file to .github/workflows/ in each AL app repo.
# It notifies OpenClaw when code lands on main or a release is published,
# so the docs agent can update the docs repo through a pull request.
#
# Required repository secrets:
#   OPENCLAW_WEBHOOK_URL    HTTPS endpoint of your OpenClaw docs agent
#   OPENCLAW_WEBHOOK_TOKEN  shared secret the endpoint checks

name: Notify docs agent

on:
  push:
    branches: [main]
    paths:
      - "**/*.al"
      - "**/app.json"
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send event to OpenClaw
        env:
          URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          TOKEN: ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg sha "$GITHUB_SHA" \
              --arg before "${{ github.event.before }}" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg tag "${{ github.event.release.tag_name }}" \
              '{repo:$repo, sha:$sha, before:$before, event:$event, tag:$tag}')"
